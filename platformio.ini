; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
cpp_standard = gnu++17

[env]
# Board
framework = arduino
platform = espressif32
board = esp32dev

# Serial
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 921600

# Build
build_unflags =
    -std=gnu++11
build_flags =
    -std=${common.cpp_standard}
    -DUSB_BAUD_RATE=921600
    -DDEBUG_BAUD_RATE=${env.monitor_speed}
    -DWARMUP_DELAY_MS=1000

# Dependencies
lib_deps = bblanchon/ArduinoJson@^7.4.2

# Linting
# WARNING: Use verbose or PIO will hide meaningful errors (e.g. clang-diagnostic-error), leading to other false positive errors
check_tool = clangtidy
check_flags =
    clangtidy:  --config-file=.clang-tidy
                ; Use the correct C++ standard (PIO doesn't forward our standard build flag).
                --extra-arg=-std=${common.cpp_standard}
                ; Treat bare .h files as C++ (clang defaults them to C).
                --extra-arg-before=-xc++
                ; Analyze as 32-bit ELF; riscv32 proxies for Xtensa, which bundled clang-tidy lacks.
                --extra-arg-before=--target=riscv32-unknown-elf
                ; The default error limit is 20, but we want to see ALL errors.
                --extra-arg=-ferror-limit=0

[env:release]
build_type = release